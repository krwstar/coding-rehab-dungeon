name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller wcwidth colorama

      - name: Build
        run: |
          pyinstaller --onefile --name coding-rehab-dungeon main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build
          path: dist/coding-rehab-dungeon