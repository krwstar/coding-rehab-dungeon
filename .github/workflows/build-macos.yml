name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller wcwidth colorama

      - name: Build game
        run: |
          python -m PyInstaller --clean --onefile --console --name game game.py

      - name: Build launcher
        run: |
          python -m PyInstaller --clean --onefile --console --name launcher launcher.py

      - name: Prepare package
        run: |
          mkdir package
          cp dist/game package/game
          cp version.json package/version.json

      - name: Make zip
        run: |
          cd package
          zip -r ../coding-rehab-dungeon-macos.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coding-rehab-dungeon-macos
          path: coding-rehab-dungeon-macos.zip

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: launcher-macos
          path: dist/launcher